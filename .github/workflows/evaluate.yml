name: Agent feasibility
on:
  workflow_dispatch:
    inputs:
      native_codex_probe:
        description: Optional native Codex Sol read-search probe; separate from the matrix
        default: false
        type: boolean
      backend:
        description: Product backend (hosted requires privately supplied HOSTED settings)
        default: local
        type: choice
        options: [local, hosted]
      profile:
        description: Profile (gmail, drive, or media composition; other services are pending)
        required: true
        default: gmail
        type: string
      model:
        description: Explicit CLIProxyAPI model ID
        required: false
        type: string
      selection:
        description: Matrix selection (required, all, or comma-separated cell IDs); omit for one model
        required: false
        type: string
      cases:
        description: Independent service cases (all or comma-separated IDs); omit for default case
        required: false
        type: string
      proxy_url:
        description: Proxy base URL supporting Anthropic Messages and OpenAI Responses
        required: true
        type: string
      output:
        description: Evidence directory (local act mounts an external directory)
        default: dist/agent-evidence
        type: string
      repeats:
        description: One trial, or two fresh fixtures for cache observation
        default: '1'
        type: choice
        options: ['1', '2']
      preflight_only:
        description: Verify both runners with synthetic responses only; no OAuth or inference
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: live-gmail-test-account
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EVAL_BACKEND: ${{ inputs.backend }}
      EVAL_RUNNER: ${{ inputs.native_codex_probe && 'codex' || '' }}
      HOSTED_VERIFICATION_URL: ${{ vars.HOSTED_VERIFICATION_URL }}
      HOSTED_EXPECTED_CANDIDATE_DIGEST: ${{ vars.HOSTED_EXPECTED_CANDIDATE_DIGEST }}
      HOSTED_EXPECTED_WORKER_VERSION: ${{ vars.HOSTED_EXPECTED_WORKER_VERSION }}
      HOSTED_ACCESS_HEADERS_JSON: ${{ secrets.HOSTED_ACCESS_HEADERS_JSON }}
      EVAL_PROFILE: ${{ inputs.profile }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_SELECTION: ${{ inputs.selection }}
      EVAL_CASES: ${{ inputs.cases }}
      EVAL_PROXY_URL: ${{ inputs.proxy_url }}
      EVAL_OUTPUT: ${{ inputs.output }}
      EVAL_REPEATS: ${{ inputs.repeats }}
      CPA_CLIENT_API_KEY: ${{ secrets.CPA_CLIENT_API_KEY }}
      GOOGLE_TEST_USER: ${{ secrets.GOOGLE_TEST_USER }}
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
      GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
    steps:
      - name: Require local act for agent evaluation
        if: env.ACT != 'true'
        run: |
          echo 'Agent evaluation runs only through local just/act and marcdev CLIProxyAPI.' >&2
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --global @anthropic-ai/claude-code@2.1.318
      - name: Install pinned native Codex for its optional capability probe
        if: inputs.native_codex_probe == true
        run: npm install --global @openai/codex@0.166.0
      - name: Verify native file tools without provider or Google calls
        run: |
          CLI="$(command -v claude)"
          EVAL_NATIVE_CLI="$CLI" node --experimental-strip-types --test tests/preflight/claude.test.ts
      - name: Verify isolated GPT runner without provider or Google calls
        run: sudo -E "$(command -v node)" --experimental-strip-types --test tests/preflight/responses.test.ts
      - name: Verify optional native Codex through synthetic relays only
        if: inputs.native_codex_probe == true
        run: |
          CLI="$(command -v codex)"
          sudo -E env EVAL_NATIVE_CODEX_CLI="$CLI" "$(command -v node)" --experimental-strip-types --test tests/preflight/codex.test.ts
      - run: node tests/run.mjs build
      - name: Run isolated native agent and independent outcome checks
        if: inputs.preflight_only != true
        run: sudo -E "$(command -v node)" --experimental-strip-types tests/eval/campaign.ts
      - name: Prepare synthetic failed-campaign report evidence without inference
        if: inputs.preflight_only == true
        run: sudo -E "$(command -v node)" --experimental-strip-types tests/eval/report-preflight.ts
      - name: Summarize retained gates, tokens, cache and cost even on failure
        if: always() && env.ACT == 'true'
        run: sudo -E "$(command -v node)" --experimental-strip-types tests/eval/report.ts "$EVAL_OUTPUT" "$EVAL_OUTPUT/workflow-report" --step-summary
      - name: Retain private evidence even on failure
        if: always() && !env.ACT && inputs.preflight_only != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.output }}
          if-no-files-found: error
          retention-days: 7
      - name: Return local evidence ownership
        if: always() && env.ACT
        run: |
          if [[ -n "${EVAL_OWNER_UID:-}" && -n "${EVAL_OWNER_GID:-}" ]]; then
            sudo chown -R "$EVAL_OWNER_UID:$EVAL_OWNER_GID" /eval-evidence
          fi
